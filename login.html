<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halı Saha AI - Giriş</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/login.js" defer></script>
</head>
<body>

    <div class="card">

        <div class="logo">
            <h1>⚽ Halı Saha AI</h1>
            <p>Hesabınıza giriş yapın</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <input
                    type="email"
                    id="email"
                    placeholder="E-Posta"
                    required>
            </div>

            <div class="form-group">
                <input
                    type="password"
                    id="password"
                    placeholder="Şifre"
                    required>
            </div>

            <button type="submit">
                Giriş Yap
            </button>

        </form>

        <div class="link">
            <a href="register.html">
                Hesabın yok mu? Kayıt Ol
            </a>
        </div>

    </div>

</body>
</html>
