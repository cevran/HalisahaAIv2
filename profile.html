<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<br><br>

<div class="card">

    <div class="logo">
        <h1>⚽ Halı Saha AI</h1>
    </div>

    <div class="profile-photo-section">

        <img
            id="profilePhoto"
            class="profile-avatar"
            src="assets/default-avatar.png"
            alt="Profil Fotoğrafı"
        >


    </div>

    <div class="player-summary">
        <h2 id="playerName">Oyuncu</h2>
        <span id="playerAge"></span>
        <div class="profile-main-score">
    ⭐ <span id="overallRatingTop">-</span>
        </div>
    </div>

    <!-- PUAN KARTI -->

    <div class="player-rating-card">

        
        <div class="rating-list">

            <div class="rating-row">
                <span>🏃 Kondisyon</span>
                <span id="conditionRating">-</span>
            </div>

            <div class="rating-row">
                <span>🎯 Teknik</span>
                <span id="techniqueRating">-</span>
            </div>

            <div class="rating-row">
                <span>⚔️ Hücum</span>
                <span id="attackRating">-</span>
            </div>

            <div class="rating-row">
                <span>🛡️ Savunma</span>
                <span id="defenseRating">-</span>
            </div>

            <div class="rating-row">
                <span>🤝 Takım Oyunu</span>
                <span id="teamplayRating">-</span>
            </div>

            <div class="rating-row">
                <span>🥅 Kalecilik</span>
                <span id="goalkeeperRating">-</span>
            </div>

            <div class="rating-row">
                <span>👑 Kaptanlık</span>
                <span id="captainRating">-</span>
            </div>

        </div>

    </div>

    <!-- PROFİL GÜNCELLE -->

    <button
        type="button"
        id="editProfileBtn"
        class="secondary-btn"
    >
        Profilimi Güncelle
    </button>

    <!-- GİZLİ PANEL -->

    <div
        id="editProfilePanel"
        class="edit-profile-panel"
        style="display:none;"
    >

        <div class="form-group">
            <label>Lakap</label>

            <input
                type="text"
                id="nickname"
                maxlength="30"
                placeholder="İsteğe bağlı"
            >
        </div>

        <div class="form-group">

            <label>Tercih Edilen Mevki</label>

            <select id="preferredPosition">
                <option value="">Seçiniz</option>
                <option value="kaleci">Kaleci</option>
                <option value="defans">Defans</option>
                <option value="ortasaha">Orta Saha</option>
                <option value="forvet">Forvet</option>
            </select>

        </div>

        <div class="form-group">

            <label>Baskın Ayak</label>

            <select id="dominantFoot">
                <option value="">Seçiniz</option>
                <option value="sag">Sağ</option>
                <option value="sol">Sol</option>
                <option value="cift">Çift Ayak</option>
            </select>

        </div>

        <div class="form-group">

            <label>Fotoğraf Yükle</label>

            <input
                type="file"
                id="photoUpload"
                accept="image/*"
            >

        </div>

        <div class="form-group">

            <label>Hazır Avatar Seç</label>

            <div
                id="avatarGrid"
                class="avatar-grid"
            >
            </div>

        </div>

        <button
            type="button"
            id="saveProfileBtn"
        >
            Kaydet
        </button>

    </div>

    <button
        type="button"
        class="logout-btn"
        onclick="logout()"
    >
        Çıkış Yap
    </button>

</div>

<div id="bottom-nav-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script src="js/bottom-nav.js"></script>

<script>
document.getElementById('bottom-nav-container').innerHTML =
    renderBottomNav('profile');
</script>

</body>
</html>
