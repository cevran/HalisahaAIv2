<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halı Saha AI - Profil</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js" defer></script>
</head>
<body>

    <div class="card">

        <div class="logo">
            <h1>⚽ Halı Saha AI</h1>
            <p>Profil Bilgileri</p>
        </div>

        <form id="profileForm">

            <div class="form-group">
                <input type="text" id="fullName" placeholder="Ad Soyad" required>
            </div>

            <div class="form-group">
                <input type="number" id="age" min="10" max="80" placeholder="Yaş" required>
            </div>

            <div class="form-group">
                <select id="preferredPosition" required>
                    <option value="">Tercih Edilen Mevki</option>
                    <option value="kaleci">Kaleci</option>
                    <option value="defans">Defans</option>
                    <option value="ortasaha">Ortasaha</option>
                    <option value="forvet">Forvet</option>
                </select>
            </div>

            <div class="form-group">
                <select id="dominantFoot" required>
                    <option value="">Dominant Ayak</option>
                    <option value="sag">Sağ</option>
                    <option value="sol">Sol</option>
                    <option value="ikiayak">İki Ayak</option>
                </select>
            </div>

            <div class="form-group">
                <label for="photoFile">Profil Fotoğrafı</label>
                <input type="file" id="photoFile" accept="image/*">
            </div>

            <div class="form-group" style="text-align:center;">
                <img id="photoPreview" src="assets/default-avatar.png" alt="Profil" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:2px solid #ddd;">
            </div>

            <button type="submit">Kaydet</button>

        </form>

    </div>

</body>
</html>
