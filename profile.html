<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="card">

    <div class="logo">
        <h1>⚽ Halı Saha AI V2</h1>
        <p>Oyuncu Profili</p>
    </div>

    <div class="profile-photo-section">

        <img
            id="profilePhoto"
            class="profile-avatar"
            src="assets/default-avatar.png"
            alt="Profil Fotoğrafı"
        >

        <input
            type="file"
            id="photoUpload"
            accept="image/*"
            hidden
        >

        <div class="photo-hint">
            Fotoğraf değiştirmek için tıkla
        </div>

    </div>

    <div class="player-summary">
        <h2 id="playerName">Oyuncu</h2>
        <span id="playerAge"></span>
    </div>

    <form id="profileForm">

        <div class="form-group">
            <label>Ad Soyad</label>
            <input type="text" id="fullName" class="readonly-field" readonly>
        </div>

        <div class="form-group">
            <label>Yaş</label>
            <input type="text" id="age" class="readonly-field" readonly>
        </div>

        <div class="form-group">
            <label>Lakap</label>
            <input type="text" id="nickname">
        </div>

        <div class="form-group">
            <label>Tercih Edilen Mevki</label>
            <select id="preferredPosition">
                <option value="">Seçiniz</option>
                <option value="kaleci">Kaleci</option>
                <option value="defans">Defans</option>
                <option value="ortasaha">Orta Saha</option>
                <option value="forvet">Forvet</option>
            </select>
        </div>

        <div class="form-group">
            <label>Baskın Ayak</label>
            <select id="dominantFoot">
                <option value="">Seçiniz</option>
                <option value="sag">Sağ</option>
                <option value="sol">Sol</option>
                <option value="cift">Çift Ayak</option>
            </select>
        </div>

        <div class="form-group">
            <label>Forma Numarası</label>
            <input type="number" id="playerNumber" min="1" max="99">
        </div>

        <div class="form-group">
            <label>Hakkımda</label>
            <textarea id="bio"></textarea>
        </div>

        <button type="submit">Profili Güncelle</button>

        <button type="button" onclick="window.location.href='groups.html'">
        👥 Gruplarım
        </button>


        <button type="button" class="logout-btn" onclick="logout()">
            Çıkış Yap
        </button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>

</body>
</html>
