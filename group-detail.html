<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grup Detayı</title>

    <link rel="stylesheet" href="css/style.css" />

    <style>

        .page-header{
            text-align:center;
            margin-bottom:20px;
        }

        .page-header h1{
            margin:0;
            font-size:32px;
        }

        /* Grup Özeti */

        .group-name{
            font-size:32px;
            font-weight:800;
            color:#222;
            text-align:center;
            margin-bottom:10px;
            line-height:1.2;
        }

        .group-info{
            font-size:16px;
            color:#666;
            font-weight:500;
            text-align:center;
            margin:5px 0;
        }

        .group-description{
            font-size:16px;
            color:#666;
            font-weight:500;
            text-align:center;
            margin-top:8px;
        }

        /* Genel Kart */

        .summary-card{
            background:white;
            border-radius:16px;
            padding:20px;
            border:1px solid #e5e7eb;
            margin-bottom:15px;
            text-align:center;
        }

        .summary-card h3{
            margin-top:0;
        }

        /* Butonlar */

        .primary-btn{
            background:#43a047;
            color:white;
            border:none;
            padding:12px 16px;
            border-radius:10px;
            cursor:pointer;
            font-size:15px;
            font-weight:600;
            width:100%;
        }

        .danger-btn{
            background:#e53935;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

        .match-btn{
            margin-top:10px;
        }

        /* Oyuncular */

        .players-title{
            text-align:center;
            margin:30px 0 15px;
        }

        .player-row{
            background:#fff;
            border:1px solid #e5e7eb;
            border-radius:16px;
            padding:16px;
            margin-bottom:15px;

            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:15px;
        }

        .player-left{
            display:flex;
            align-items:center;
            gap:14px;
            flex:1;
            min-width:0;
        }

        .player-avatar{
            width:70px;
            height:70px;
            border-radius:50%;
            object-fit:cover;
            border:3px solid #f1f5f9;
            flex-shrink:0;
        }

        .player-info{
            display:flex;
            flex-direction:column;
            align-items:flex-start;
            justify-content:center;
        }

        .player-name{
            font-size:19px;
            font-weight:700;
            color:#111;
            margin-bottom:4px;
            text-align:left;
        }

        .player-role{
            font-size:13px;
            color:#777;
            text-align:left;
        }

        .player-actions{
            display:flex;
            flex-direction:column;
            gap:8px;
            flex-shrink:0;
        }

        .player-actions .primary-btn,
        .player-actions .danger-btn{
            width:130px;
            height:38px;
            font-size:13px;
            font-weight:600;
            padding:0;
        }

        /* Progress */

        .progress-wrapper{
            width:100%;
            height:18px;
            background:#eee;
            border-radius:20px;
            overflow:hidden;
            margin:15px 0;
        }

        .progress-bar{
            width:0%;
            height:100%;
            background:#43a047;
        }

        /* Mobil */

        @media (max-width:600px){

            .player-row{
                gap:10px;
            }

            .player-name{
                font-size:17px;
            }

            .player-actions .primary-btn,
            .player-actions .danger-btn{
                width:120px;
            }

        }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="container">

    <!-- Grup Özeti -->

    <div id="groupInfo" class="summary-card">
        Yükleniyor...
    </div>

    <!-- Oyuncuları Değerlendir -->

    <button
        id="ratePlayersBtn"
        class="primary-btn">
        ⭐ Oyuncuları Değerlendir
    </button>

    <!-- Değerlendirme Durumu -->

    <div
        id="ratingProgressCard"
        class="summary-card">

        <h3>⭐ Değerlendirme Durumu</h3>

        <div class="progress-wrapper">
            <div
                id="ratingProgressBar"
                class="progress-bar">
            </div>
        </div>

        <div id="ratingProgressText">
            Hesaplanıyor...
        </div>

    </div>

    <!-- Maç Yönetimi -->

    <div class="summary-card">

        <h3>⚽ Maç Yönetimi</h3>

        <button
            id="createMatchBtn"
            class="primary-btn match-btn">
            ⚽ Yeni Maç Oluştur
        </button>

    </div>

    <h2 class="players-title">
        Oyuncular
    </h2>

    <div id="playersList"></div>

</div>

<div id="bottom-nav-container"></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/group-detail.js"></script>
<script src="js/bottom-nav.js"></script>

<script>
document.getElementById('bottom-nav-container').innerHTML =
    renderBottomNav('groups');
</script>

</body>
</html>
