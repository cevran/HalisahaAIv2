<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grup Detayı</title>

    <link rel="stylesheet" href="css/style.css" />

    <style>
        .page-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .summary-card {
            background:white;
            border-radius:12px;
            padding:15px;
            border:1px solid #ddd;
            margin-bottom:15px;
        }

        .group-actions {
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }

        .group-actions button {
            padding:10px 15px;
            cursor:pointer;
        }

        .player-row {
            display:flex;
            justify-content:space-between;
            align-items:center;
            border:1px solid #ddd;
            border-radius:10px;
            padding:12px;
            margin-bottom:10px;
            background:#fff;
        }

        .player-actions {
            display:flex;
            gap:8px;
        }

        .role-badge {
            background:#1e88e5;
            color:white;
            padding:4px 8px;
            border-radius:6px;
            font-size:12px;
        }

        .danger-btn {
            background:#e53935;
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:6px;
        }

        .primary-btn {
            background:#43a047;
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:6px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="container">

    <div class="page-header">
        <h1 id="groupName">Grup Yükleniyor...</h1>
    </div>

    <div id="groupInfo" class="summary-card">
        Yükleniyor...
    </div>

    <div class="summary-card">
        <h3>Oyuncu Sayısı</h3>
        <div id="playerCount">0</div>
    </div>

    <button id="ratePlayersBtn" class="primary-btn">
        ⭐ Oyuncuları Değerlendir
    </button>

    <div
        id="ratingProgressCard"
        class="summary-card">

        <h3>Oyuncu Değerlendirmeleri</h3>

        <div
            style="
                width:100%;
                background:#eee;
                height:20px;
                border-radius:10px;
                overflow:hidden;
                margin:10px 0;
            "
        >

            <div
                id="ratingProgressBar"
                style="
                    width:0%;
                    height:100%;
                    background:#43a047;
                "
            ></div>

        </div>

        <div id="ratingProgressText">
            Hesaplanıyor...
        </div>

    </div>

    <div class="group-actions">
        <button id="createMatchBtn" class="primary-btn">
            ⚽ Maç Oluştur
        </button>
    </div>

    <h2>Oyuncular</h2>

    <div id="playersList"></div>

</div>

<div id="bottom-nav-container"></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/group-detail.js"></script>
<script src="js/bottom-nav.js"></script>

<script>
document.getElementById('bottom-nav-container').innerHTML =
    renderBottomNav('groups');
</script>

</body>
</html>
