<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grup Detayı</title>

    <link rel="stylesheet" href="css/style.css" />

    <style>

        .page-header{
            text-align:center;
            margin-bottom:20px;
        }

        .page-header h1{
            margin:0;
            font-size:32px;
        }

        .summary-card{
            background:white;
            border-radius:16px;
            padding:20px;
            border:1px solid #e5e7eb;
            margin-bottom:15px;
            text-align:center;
        }

        .summary-card h3{
            margin-top:0;
        }

        .group-actions{
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }

        .group-actions button{
            padding:10px 15px;
            cursor:pointer;
        }

        .primary-btn{
            background:#43a047;
            color:white;
            border:none;
            padding:12px 16px;
            border-radius:10px;
            cursor:pointer;
            font-size:15px;
            font-weight:600;
            width:100%;
        }

        .danger-btn{
            background:#e53935;
            color:white;
            border:none;
            padding:10px 14px;
            border-radius:8px;
            cursor:pointer;
        }

        .players-title{
            text-align:center;
            margin:30px 0 15px;
        }

        .player-row{
            background:#fff;
            border:1px solid #e5e7eb;
            border-radius:16px;
            padding:18px;
            margin-bottom:15px;
            text-align:center;
        }

        .player-avatar{
            width:70px;
            height:70px;
            border-radius:50%;
            object-fit:cover;
            margin-bottom:10px;
            border:3px solid #f1f5f9;
        }

        .player-name{
            font-size:18px;
            font-weight:600;
            margin-bottom:10px;
        }

        .player-role{
            display:inline-block;
            background:#f3f4f6;
            color:#333;
            padding:6px 12px;
            border-radius:20px;
            font-size:13px;
            margin-bottom:10px;
        }

        .player-status{
            display:block;
            margin-bottom:15px;
            font-size:14px;
            font-weight:600;
        }

        .player-status.rated{
            color:#2e7d32;
        }

        .player-status.unrated{
            color:#d32f2f;
        }

        .player-actions{
            display:flex;
            justify-content:center;
            gap:10px;
            flex-wrap:wrap;
        }

        .match-btn{
            margin-top:10px;
        }

        .progress-wrapper{
            width:100%;
            height:18px;
            background:#eee;
            border-radius:20px;
            overflow:hidden;
            margin:15px 0;
        }

        .progress-bar{
            width:0%;
            height:100%;
            background:#43a047;
        }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="container">

    <div class="page-header">
        <h1 id="groupName">Grup Yükleniyor...</h1>
    </div>

    <!-- Grup Özeti -->

    <div id="groupInfo" class="summary-card">
        Yükleniyor...
    </div>

    <!-- Değerlendir -->

    <button
        id="ratePlayersBtn"
        class="primary-btn">
        ⭐ Oyuncuları Değerlendir
    </button>

    <!-- İlerleme -->

    <div
        id="ratingProgressCard"
        class="summary-card">

        <h3>⭐ Değerlendirme Durumu</h3>

        <div class="progress-wrapper">
            <div
                id="ratingProgressBar"
                class="progress-bar">
            </div>
        </div>

        <div id="ratingProgressText">
            Hesaplanıyor...
        </div>

    </div>

    <!-- Maç -->

    <div class="summary-card">

        <h3>⚽ Maç Yönetimi</h3>

        <button
            id="createMatchBtn"
            class="primary-btn match-btn">
            ⚽ Yeni Maç Oluştur
        </button>

    </div>

    <h2 class="players-title">
        Oyuncular
    </h2>

    <div id="playersList"></div>

</div>

<div id="bottom-nav-container"></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/group-detail.js"></script>
<script src="js/bottom-nav.js"></script>

<script>
document.getElementById('bottom-nav-container').innerHTML =
    renderBottomNav('groups');
</script>

</body>
</html>
