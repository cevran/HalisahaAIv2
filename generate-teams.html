<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Halı Saha AI - Takımlar</title>

<style>

:root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --green:#10b981;
    --red:#ef4444;
    --shadow:0 8px 24px rgba(0,0,0,.08);
    --radius:20px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    padding-bottom:120px;
}

.page-header{
    background:linear-gradient(135deg,#111827,#1f2937);
    color:white;
    padding:26px 20px;
}

.page-header h1{
    font-size:26px;
    font-weight:800;
}

.page-header p{
    margin-top:8px;
    opacity:.85;
}

.container{
    padding:16px;
}

.card{
    background:white;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:16px;
}

.summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.summary-value{
    font-size:28px;
    font-weight:800;
}

.summary-label{
    color:var(--muted);
    margin-top:4px;
    font-size:14px;
}

.balance-good{
    color:var(--green);
}

.pitch-card{
    background:white;
    border-radius:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
    margin-bottom:20px;
}

.team-header{
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.white-team{
    background:#f3f4f6;
    border-left:6px solid #d1d5db;
}

.red-team{
    background:#fef2f2;
    border-left:6px solid var(--red);
}

.team-title{
    font-size:20px;
    font-weight:800;
}

.team-power{
    font-size:22px;
    font-weight:800;
}

.pitch{
    background:
        linear-gradient(
            180deg,
            #2e8b57,
            #20754a
        );

    padding:20px 12px;
}

.line{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:18px 0;
    flex-wrap:wrap;
}

.player-card{
    width:92px;
    background:rgba(255,255,255,.95);
    border-radius:14px;
    padding:8px;
    text-align:center;
}

.player-name{
    font-size:12px;
    font-weight:700;
}

.player-power{
    margin-top:4px;
    font-size:11px;
}

.position{
    margin-top:4px;
    font-size:10px;
    color:#64748b;
}

.team-details{
    padding:18px;
}

.team-details ul{
    list-style:none;
}

.team-details li{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #f1f5f9;
}

.team-details li:last-child{
    border:none;
}

.captain{
    color:#f59e0b;
    font-weight:700;
}

.analysis-grid{
    display:grid;
    gap:12px;
}

.analysis-item{
    display:flex;
    justify-content:space-between;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:24px;
}

.btn{
    border:none;
    border-radius:16px;
    padding:16px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.btn-secondary{
    background:#e5e7eb;
}

.btn-primary{
    background:#10b981;
    color:white;
}

.loading{
    text-align:center;
    padding:40px;
    color:#64748b;
}

</style>
</head>

<body>

<div class="page-header">

    <h1>⚽ Maç Hazır</h1>

    <p>
        Takımlar oluşturuldu
    </p>

</div>

<div class="container">

    <!-- MAÇ ÖZET -->

    <div class="card">

        <div class="summary-grid">

            <div>

                <div
                    class="summary-value"
                    id="playerCount">
                    0
                </div>

                <div class="summary-label">
                    Oyuncu
                </div>

            </div>

            <div>

                <div
                    class="summary-value balance-good"
                    id="powerDiff">
                    0.0
                </div>

                <div class="summary-label">
                    Güç Farkı
                </div>

            </div>

        </div>

        <br>

        <div
            id="balanceText"
            class="balance-good"
            style="font-weight:700;">
            ★★★★★ Mükemmele Yakın
        </div>

    </div>

    <!-- BEYAZ TAKIM -->

    <div class="pitch-card">

        <div
            class="team-header white-team">

            <div
                class="team-title">
                ⚪ Beyaz Takım
            </div>

            <div
                id="whitePower"
                class="team-power">
                0.0
            </div>

        </div>

        <div
            id="whitePitch"
            class="pitch">

            <div class="loading">
                Takımlar oluşturuluyor...
            </div>

        </div>

        <div
            id="whiteDetails"
            class="team-details">

        </div>

    </div>

    <!-- KIRMIZI TAKIM -->

    <div class="pitch-card">

        <div
            class="team-header red-team">

            <div
                class="team-title">
                🔴 Kırmızı Takım
            </div>

            <div
                id="redPower"
                class="team-power">
                0.0
            </div>

        </div>

        <div
            id="redPitch"
            class="pitch">

            <div class="loading">
                Takımlar oluşturuluyor...
            </div>

        </div>

        <div
            id="redDetails"
            class="team-details">

        </div>

    </div>

    <!-- ANALİZ -->

    <div class="card">

        <h3>
            📊 Maç Analizi
        </h3>

        <br>

        <div class="analysis-grid">

            <div class="analysis-item">
                <span>⚪ Beyaz Takım</span>
                <b id="analysisWhite">
                    0.0
                </b>
            </div>

            <div class="analysis-item">
                <span>🔴 Kırmızı Takım</span>
                <b id="analysisRed">
                    0.0
                </b>
            </div>

            <div class="analysis-item">
                <span>Güç Farkı</span>
                <b id="analysisDiff">
                    0.0
                </b>
            </div>

            <div class="analysis-item">
                <span>Denge Skoru</span>
                <b id="analysisBalance">
                    ★★★★★
                </b>
            </div>

        </div>

    </div>

    <!-- AKSİYONLAR -->

    <div class="actions">

        <button
            id="regenerateBtn"
            class="btn btn-secondary">

            🔄 Yeniden Oluştur

        </button>

        <button
            id="saveMatchBtn"
            class="btn btn-primary">

            ✅ Maçı Kaydet

        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/generate-teams.js"></script>


</body>
</html>
