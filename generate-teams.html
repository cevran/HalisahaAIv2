<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Halı Saha AI - Takımlar</title>

<link rel="stylesheet" href="css/generate-teams.css">

</head>

<body>

<div class="container">

    <!-- ÜST ÖZET -->
    <div class="page-header">
        <h1>⚽ Maç oluşturuldu</h1>
    </div>

    <!-- PAYLAŞIM ALANI -->
    <div id="shareArea" class="pitch-card">

        <div class="share-title">
            ⚽ HALI SAHA AI
        </div>

        <div class="single-pitch-header">

            <div class="match-details">

                <div
                    id="matchDateDisplay"
                    class="match-date">
                </div>

                <div
                    id="pitchNameDisplay"
                    class="match-pitch">
                </div>

            </div>

            <div class="teams-row">

                <div class="team-score">

                    <span>
                        ⚪ Beyaz Takım
                    </span>

                    <span
                        id="whitePower"
                        class="team-power">
                        0.0
                    </span>

                </div>

                <div class="team-score">

                    <span>
                        🔴 Kırmızı Takım
                    </span>

                    <span
                        id="redPower"
                        class="team-power">
                        0.0
                    </span>

                </div>

            </div>

        </div>

        <!-- TAKIM DİZİLİMLERİ -->

        <div class="teams-layout">

            <div class="team-side">

                <div class="side-title">
                    ⚪ BEYAZ TAKIM
                </div>

                <div
                    id="whitePitch"
                    class="team-formation">

                    <div class="loading">
                        Takımlar oluşturuluyor...
                    </div>

                </div>

            </div>

            <div class="team-side">

                <div class="side-title">
                    🔴 KIRMIZI TAKIM
                </div>

                <div
                    id="redPitch"
                    class="team-formation">
                </div>

            </div>

        </div>

        <!-- PAYLAŞIM ANALİZLERİ -->

        <div class="share-stats-wrapper">

            <div
                id="whiteTeamStatsShare"
                class="share-team-stats">
            </div>

            <div
                id="redTeamStatsShare"
                class="share-team-stats">
            </div>

        </div>

    </div>

    <!-- SAYFA ANALİZLERİ -->

    <div class="team-stats-section">

        <div
            id="whiteTeamStats"
            class="team-stats-card">
        </div>

        <div
            id="redTeamStats"
            class="team-stats-card">
        </div>

    </div>

    <!-- AKSİYONLAR -->

    <div class="actions">

        <button
            id="regenerateBtn"
            class="btn btn-secondary">

            🔄 Yeniden Oluştur

        </button>

        <button
            id="shareMatchBtn"
            class="btn btn-share">

            📤 Paylaş

        </button>

        <button
            id="saveMatchBtn"
            class="btn btn-primary">

            ✅ Maçı Kaydet

        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/generate-teams.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>

</body>


</html>
