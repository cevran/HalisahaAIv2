<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Halı Saha AI - Takımlar</title>

<link rel="stylesheet" href="css/generate-teams.css">

</head>

<body>

<div class="container">

    <!-- ÜST ÖZET -->
    <div class="page-header">
        <h1>⚽ Maç oluşturuldu</h1>
    </div>

    <!-- TEK SAHA -->

    <div class="pitch-card">

        <div class="single-pitch-header">

            <div class="team-score">
                <span>⚪ Beyaz Takım</span>
                <span id="whitePower" class="team-power">
                    0.0
                </span>
            </div>

            <div class="team-score">
                <span>🔴 Kırmızı Takım</span>
                <span id="redPower" class="team-power">
                    0.0
                </span>
            </div>

        </div>

        <div id="fullPitch" class="full-pitch">
            <div id="whitePitch" class="pitch-half">
                <div class="loading">
                    Takımlar oluşturuluyor...
                </div>
            </div>

            <div class="center-line">⚽</div>

            <div id="redPitch" class="pitch-half"></div>
        </div>

    </div>

    <!-- ANALİZ -->

    <div class="card">

        <h3>📊 Maç Analizi</h3>

        <br>

        <div class="analysis-grid">

            <div class="analysis-item">
                <span>⚪ Beyaz Takım</span>
                <b id="analysisWhite">0.0</b>
            </div>

            <div class="analysis-item">
                <span>🔴 Kırmızı Takım</span>
                <b id="analysisRed">0.0</b>
            </div>

            <div class="analysis-item">
                <span>Güç Farkı</span>
                <b id="analysisDiff">0.0</b>
            </div>

            <div class="analysis-item">
                <span>Denge Skoru</span>
                <b id="analysisBalance">★★★★★</b>
            </div>

        </div>

    </div>

    <!-- AKSİYONLAR -->

    <div class="actions">

        <button id="regenerateBtn" class="btn btn-secondary">
            🔄 Yeniden Oluştur
        </button>

        <button class="btn btn-primary">
            ✅ Maçı Kaydet
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/generate-teams.js"></script>

</body>
</html>
