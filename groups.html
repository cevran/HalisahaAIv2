<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruplarım - Halı Saha AI V2</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="card">

    <div class="logo">
        <h1>⚽ Halı Saha AI V2</h1>
        <p>Gruplarım</p>
    </div>

    <form id="createGroupForm">

        <div class="form-group">
            <label>Grup Adı</label>
            <input type="text" id="groupName" required>
        </div>

        <div class="form-group">
            <label>Şehir</label>
            <input type="text" id="groupCity">
        </div>

        <div class="form-group">
            <label>Açıklama</label>
            <textarea id="groupDescription"></textarea>
        </div>

        <div class="form-group">
            <label>Maksimum Oyuncu Sayısı</label>
            <input type="number" id="maxPlayers" value="20" min="2" max="100">
        </div>

        <button type="submit">+ Yeni Grup Oluştur</button>
    </form>

    <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">

    <h3 style="margin-bottom:15px;">Üyesi Olduğum Gruplar</h3>

    <div id="groupsList">
        <p>Gruplar yükleniyor...</p>
    </div>

    <br>

    <button type="button" onclick="window.location.href='profile.html'">
        Profile Dön
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/groups.js"></script>
</body>
</html>
