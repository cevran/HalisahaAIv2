<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maç Detayı</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/match-detail.css">
    
</head>
<body>

<div class="card">

    <div class="logo">
        <h1>⚽ Halı Saha AI</h1>
        <p>Maç Detayı</p>
    </div>

    <div id="matchDetail">

        <div class="loading-box">
            Yükleniyor...
        </div>

    </div>

</div>

<div id="bottom-nav-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/bottom-nav.js"></script>
<script src="js/match-detail.js"></script>

<script>
document.getElementById(
    "bottom-nav-container"
).innerHTML =
    renderBottomNav("groups");
</script>

<div id="scoreModal" class="modal-overlay hidden">

    <div class="modal-card">

        <h2>⚽ Maç Sonucu</h2>

        <div class="form-group">
            <label>⚪ Beyaz Takım</label>

            <input
                type="number"
                id="whiteScoreInput"
                min="0"
                value="0"
            >
        </div>

        <div class="form-group">
            <label>🔴 Kırmızı Takım</label>

            <input
                type="number"
                id="redScoreInput"
                min="0"
                value="0"
            >
        </div>

        <div class="modal-buttons">

            <button
                id="saveScoreBtn"
            >
                ✅ Kaydet
            </button>

            <button
                id="cancelScoreBtn"
                class="secondary-btn"
            >
                İptal
            </button>

        </div>

    </div>

</div>

</body>
</html>
