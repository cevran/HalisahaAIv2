<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oyuncu Değerlendirmeleri</title>
<link rel="stylesheet" href="css/style.css">
<style>
.rating-card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:15px;margin-bottom:15px}
.player-name{font-size:18px;font-weight:700;margin-bottom:15px}
.rating-line{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.star-rating{display:flex;gap:3px}
.star{font-size:28px;cursor:pointer;color:#d1d5db;transition:.2s}
.star.active{color:#fbbf24}
.save-bar{position:sticky;bottom:80px;background:#fff;padding:10px 0}
</style>
</head>
<body>
<div class="container">
    <h1>⭐ Oyuncu Değerlendirmeleri</h1>

    <div id="playersContainer">
        <p>Oyuncular yükleniyor...</p>
    </div>

    <div class="save-bar">
        <button id="saveRatingsBtn" class="primary-btn" style="width:100%;padding:14px;">
            💾 Tüm Değerlendirmeleri Kaydet
        </button>
    </div>
</div>

<div id="bottom-nav-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/bottom-nav.js"></script>
<script src="js/rate-players.js"></script>

<script>
document.getElementById('bottom-nav-container').innerHTML = renderBottomNav('groups');
</script>

<template id="playerCardTemplate">
<div class="rating-card">
    <div class="player-name"></div>

    <div class="rating-line"><span>Kondisyon</span><div class="star-rating" data-field="condition_score"></div></div>
    <div class="rating-line"><span>Teknik</span><div class="star-rating" data-field="technique_score"></div></div>
    <div class="rating-line"><span>Hücum</span><div class="star-rating" data-field="attack_score"></div></div>
    <div class="rating-line"><span>Defans</span><div class="star-rating" data-field="defense_score"></div></div>
    <div class="rating-line"><span>Takım Oyunu</span><div class="star-rating" data-field="teamplay_score"></div></div>
    <div class="rating-line"><span>Kalecilik</span><div class="star-rating" data-field="goalkeeper_score"></div></div>
    <div class="rating-line"><span>Kaptanlık</span><div class="star-rating" data-field="captain_score"></div></div>
</div>
</template>

</body>
</html>
