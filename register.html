<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Halisaha AI V2</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Register</h1>

    <form id="registerForm">
      <div class="form-group">
        <label for="fullName">Ad Soyad</label>
        <input type="text" id="fullName" name="fullName" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="password">Şifre</label>
        <input type="password" id="password" name="password" required />
      </div>

      <div class="form-group">
        <label for="passwordConfirm">Şifre Tekrar</label>
        <input type="password" id="passwordConfirm" name="passwordConfirm" required />
      </div>

      <div class="form-group">
        <label for="birthYear">Doğum Yılı</label>
        <input type="number" id="birthYear" name="birthYear" min="1950" max="2020" required />
      </div>

      <button type="submit">Kayıt Ol</button>
    </form>

    <p>
      Zaten hesabın var mı? <a href="login.html">Giriş Yap</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/register.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
